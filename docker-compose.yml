name: civicverse-ai

services:
  postgres:
    image: postgres:16-alpine
    container_name: civicverse_postgres
    environment:
      POSTGRES_USER: civicverse
      POSTGRES_PASSWORD: civicverse_pass
      POSTGRES_DB: civicverse_db
    ports:
      - "5433:5432"
    volumes:
      - civicverse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U civicverse -d civicverse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: civicverse_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  civicverse_pgdata:
